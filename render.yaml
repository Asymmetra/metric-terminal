services:
  - type: web
    name: metric-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: CORS_ORIGIN
        sync: false
      - key: RUST_LOG
        value: metric_backend=info
      - key: IMPERIAL_API_URL
        value: https://api.imperial.space
      - key: IMPERIAL_WS_URL
        value: wss://api.imperial.space
