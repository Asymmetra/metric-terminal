[package]
name = "ember-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Phoenix Rise SDK (local path dependencies)
phoenix-sdk = { path = "../phoenix-rise-sdk/rust/sdk" }
phoenix-types = { path = "../phoenix-rise-sdk/rust/types" }
phoenix-ix = { path = "../phoenix-rise-sdk/rust/ix" }
phoenix-math-utils = { path = "../phoenix-rise-sdk/rust/math" }

# Web framework
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# State
dashmap = "6"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Async utilities
futures = "0.3"

# Solana types (matching SDK versions)
solana-pubkey = { version = "~2.4", features = ["curve25519"] }
solana-instruction = { version = "~2.3", default-features = false, features = ["std"] }

# Encoding
base64 = "0.22"
