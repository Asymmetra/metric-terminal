min_version = "2026.3.16"

[settings]
experimental                        = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile                            = true

[tools]
bun     = "1.3.9"
node    = "22"
rg      = "15.1"
sccache = "0.14.0"
uv      = "0.9"

[hooks]
enter = "mise i -q"

[env]
CARGO_INCREMENTAL = "0"
MISE_HTTP_TIMEOUT = "60"
# Mirror the Phoenix Rust environment so cargo invocations behave the same way.
PHOENIX_RUST_NIGHTLY = "nightly-2025-12-02"
RUSTC_WRAPPER        = "sccache"
SCCACHE_BASEDIRS     = "{{config_root}}"
SCCACHE_CACHE_SIZE   = "35G"

[tasks.test]
description = "Run all Rust and TypeScript tests"
depends     = ["test-rust", "test-ts"]

[tasks.build]
description = "Build the Rust and TypeScript workspaces"
depends     = ["build-rust", "build-ts"]

[tasks.check]
description = "Lint the Rust and TypeScript workspaces"
depends     = ["check-rust", "check-ts"]

[tasks.build-rust]
description = "Build all Rust crates"
dir         = "{{config_root}}/rust"
run         = "cargo build"

[tasks.check-rust]
description = "Run Rust lints"
dir         = "{{config_root}}/rust"
run         = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test-rust]
description = "Run all Rust tests"
dir         = "{{config_root}}/rust"
run         = "cargo test"

[tasks.ensure-ts-deps]
description = "Install TypeScript dependencies when they are missing or stale"
dir         = "{{config_root}}/ts"
run = """case \"${CI:-}\" in
  \"\"|0|false|False|FALSE) ;;
  *) exit 0 ;;  # CI truthy: skip bun install
esac
if [ ! -d node_modules ] || [ bun.lock -nt node_modules ] || [ package.json -nt node_modules ]; then
  bun install && touch node_modules
fi"""

[tasks.test-ts]
description = "Run all TypeScript tests"
depends     = ["ensure-ts-deps"]
dir         = "{{config_root}}/ts"
run         = "bun run test"

[tasks.build-ts]
description = "Build the TypeScript workspace"
depends     = ["ensure-ts-deps"]
dir         = "{{config_root}}/ts"
run         = "bun run build"

[tasks.check-ts]
description = "Run TypeScript lints"
depends     = ["ensure-ts-deps"]
dir         = "{{config_root}}/ts"
run         = "bun run lint"
