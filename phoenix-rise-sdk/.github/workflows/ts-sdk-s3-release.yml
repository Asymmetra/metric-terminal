name: TS SDK S3 Release

on:
  push:
    branches:
      - master
    paths:
      - "ts/**"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && format('master-{0}', github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  id-token: write

jobs:
  lint-test-pack-upload:
    runs-on: gha-selfhosted-amd64-8core
    env:
      CI: true
      RISE_S3_BUCKET: phoenix-rise-public-sdk
      TS_WORKSPACE: ts
      TS_TARGET: rise
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@c2d97f11654f7a060eecccb741941f14459a21a0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::829210487188:role/GHARise
          role-session-name: ${{ github.event.repository.name }}
          unset-current-credentials: true

      - uses: jdx/mise-action@v3
        with:
          working_directory: ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Pack and upload tarball to S3
        run: uv run ../scripts/upload_s3_tarball.py --bucket "${RISE_S3_BUCKET}" --skip-sso-login
