[package]
name = "metric-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# State
dashmap = "6"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Solana pubkey parsing (input validation only; no tx-building here)
solana-pubkey = { version = "~2.4", features = ["curve25519"] }

# Encoding (the deposit-build-tx response carries a base64 VersionedTransaction
# that we pass through unchanged to the client signer).
base64 = "0.22"

# Imperial HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
