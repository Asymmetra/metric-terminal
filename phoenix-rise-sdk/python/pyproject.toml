[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phoenix-sdk"
version = "0.1.0"
description = "Python SDK for the Phoenix perpetuals exchange"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "solders>=0.21",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
